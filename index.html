<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planet Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Caprasimo", serif;
    }

    body {
      background: linear-gradient(135deg, #1d2671, #c33764);
      min-height: 100vh;
      color: white;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }

    .logo {
      font-size: 28px;
      padding: 8px 20px;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff512f, #dd2476);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      background: rgba(255,255,255,0.15);
      transition: 0.3s;
    }

    nav a:hover {
      background: white;
      color: black;
    }

    .signup {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
    }

    .MENU {
      display: none;
      background: linear-gradient(45deg, #f7971e, #ffd200);
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
    }

    /* MAIN */
    main {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .planet {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.05)
      );
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: 0.4s;
    }

    .planet:hover {
      transform: translateY(-10px) scale(1.03);
    }

    .planet img {
      width: 170px;
    }

    .planet h2 {
      font-size: 30px;
      margin: 15px 0;
      background: linear-gradient(45deg, #ffecd2, #fcb69f);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .planet p {
      font-size: 15px;
      opacity: 0.9;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 25px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(45deg, #43e97b, #38f9d7);
      transition: 0.3s;
    }

    .btn:hover {
      background: linear-gradient(45deg, #fa709a, #fee140);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .MENU {
        display: block;
      }

      nav {
        display: none;
        width: 100%;
        margin-top: 15px;
      }

      nav.active {
        display: block;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Planeterium</div>
  <button class="MENU" onclick="toggleMenu()">MENU</button>
  <nav id="nav">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Discounts</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Buy</a></li>
      <li><a href="#" class="signup">Sign Up</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="planet"><img src="Assets/Mercury.jpg"><h2>Mercury</h2><p>Closest planet to the Sun.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/venus.webp"><h2>Venus</h2><p>Hottest planet.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/mars.webp"><h2>Mars</h2><p>The red planet.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/jupiter.webp"><h2>Jupiter</h2><p>Largest planet.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/saturn.webp"><h2>Saturn</h2><p>Ringed planet.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/uranus.webp"><h2>Uranus</h2><p>Ice giant.</p><button class="btn">Buy Now</button></div>
  <div class="planet"><img src="Assets/neptune.webp"><h2>Neptune</h2><p>Farthest planet.</p><button class="btn">Buy Now</button></div>
</main>

<script>
  function toggleMenu() {
    document.getElementById("nav").classList.toggle("active");
  }
</script>

</body>
</html>
